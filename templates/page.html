<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.classList.add('js');</script>
  {{seo}}
  <meta name="theme-color" content="#07071a">
  <link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{root}}assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
  <link rel="manifest" href="{{root}}site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{root}}css/tokens.css">
  <link rel="stylesheet" href="{{root}}css/base.css">
  <link rel="stylesheet" href="{{root}}css/sections.css">
  <link rel="stylesheet" href="{{root}}css/components.css">
  <link rel="stylesheet" href="{{root}}css/responsive.css">
  {{jsonld}}
</head>
<body data-lang="{{lang}}" data-root="{{root}}" data-hash="{{hash}}">
<div id="glow" aria-hidden="true"></div>
<div id="siteHeader">
{{header}}
</div>
<main id="main">
{{main}}
</main>
<div id="siteFooter">
{{footer}}
</div>
<dialog id="modal" class="modal" aria-labelledby="modalTitle">
  <button class="modal__close" type="button" aria-label="{{close}}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div id="modalBody"></div>
</dialog>
<script type="module" src="{{root}}js/app.js"></script>
</body>
</html>
